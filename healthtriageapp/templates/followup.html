<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HealthGuide — Follow-up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>HealthGuide</h1>

        <section class="card">
            <h2>A couple more questions</h2>

            <form action="/result" method="POST">
                <!-- carry the original symptom text forward invisibly -->
                <input type="hidden" name="symptoms_text" value="{{ symptoms_text }}">

                <fieldset>
                    <legend>How severe is it?</legend>
                    <label><input type="radio" name="severity" value="mild" required> Mild</label>
                    <label><input type="radio" name="severity" value="moderate"> Moderate</label>
                    <label><input type="radio" name="severity" value="severe"> Severe</label>
                </fieldset>

                <fieldset>
                    <legend>When did it begin?</legend>
                    <label><input type="radio" name="duration" value="today" required> Today</label>
                    <label><input type="radio" name="duration" value="1_to_3"> 1–3 days</label>
                    <label><input type="radio" name="duration" value="more_than_3"> More than 3 days</label>
                </fieldset>

                <button type="submit">See result</button>
            </form>
        </section>
    </main>
</body>
</html>
